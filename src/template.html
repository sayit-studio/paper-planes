<title>紙飛機小學堂</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 手作勞作風：方格作業紙底、貼紙卡片（粗邊＋硬陰影）、紙膠帶、蠟筆色。手機為主。 */
:root {
  --bg: #fbf5e6; --grid: rgb(70 110 160 / 0.11); --surface: #fffdf6; --surface-2: #f5ecd6; --ink: #2b2a3d; --muted: #6b6577;
  --edge: #2b2a3d; --soft: #e2d6bc; --accent: #ffc93c; --accent-ink: #3a2700; --focus: #2f7fd1; --pink: #ff8fa3; --sky: #8fd0ff;
  --lift: #2f7fd1; --weight: #c4572b; --thrust: #23926f; --drag: #7a68b5; --good: #23926f; --stage: #dfeaf2;
  --f-display: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --nav-h: 66px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d2130; --grid: rgb(255 255 255 / 0.05); --surface: #2a3043; --surface-2: #343b51; --ink: #f6f0e1; --muted: #bdb5a6;
    --edge: #0c0e16; --soft: #464e66; --accent: #ffc93c; --accent-ink: #2b1d00; --focus: #8fc8ff; --pink: #ff8fa3; --sky: #6fb6ea;
    --lift: #6aaef0; --weight: #ec8a5f; --thrust: #4cc59d; --drag: #a998e3; --good: #4cc59d; --stage: #13283a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d2130; --grid: rgb(255 255 255 / 0.05); --surface: #2a3043; --surface-2: #343b51; --ink: #f6f0e1; --muted: #bdb5a6;
  --edge: #0c0e16; --soft: #464e66; --accent: #ffc93c; --accent-ink: #2b1d00; --focus: #8fc8ff; --pink: #ff8fa3; --sky: #6fb6ea;
  --lift: #6aaef0; --weight: #ec8a5f; --thrust: #4cc59d; --drag: #a998e3; --good: #4cc59d; --stage: #13283a;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink); font-family: var(--f-display); font-size: 16px; line-height: 1.6; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
a { color: var(--lift); }
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 400; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 貼紙：粗邊、不太規則的圓角、硬陰影 */
.paper { background: var(--surface); border: 2.5px solid var(--edge); border-radius: 18px 14px 20px 13px / 14px 20px 13px 18px; box-shadow: 3px 4px 0 var(--edge); }
/* 紙膠帶 */
.tape { position: relative; }
.tape::before { content: ""; position: absolute; top: -11px; left: 50%; width: 76px; height: 20px; transform: translateX(-50%) rotate(-3deg);
  background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--pc, var(--accent)) 70%, transparent) 0 6px, color-mix(in srgb, var(--pc, var(--accent)) 50%, transparent) 6px 12px);
  border-radius: 2px; pointer-events: none; }

.app { min-height: 100%; display: flex; flex-direction: column; }
.top { padding-block: 8px 8px; display: flex; flex-direction: column; gap: 8px; }
.brand { display: flex; align-items: center; gap: 6px; font-size: 15px; letter-spacing: 0.06em; color: var(--muted); }
.brand svg { width: 30px; height: 22px; flex: none; }
/* 標題就是這架飛機：名字＋個性＋標籤；點名字下拉換別架 */
.planebar { --pc: var(--accent); display: flex; flex-direction: column; gap: 8px; max-width: 760px; }
.pickwrap { position: relative; }
.pick { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 5px 8px 5px 6px; background: color-mix(in srgb, var(--pc) 20%, var(--surface)); border: 2.5px solid var(--edge); border-radius: 18px 14px 18px 14px; box-shadow: 3px 4px 0 var(--edge); }
.pick:active { transform: translateY(2px); box-shadow: 1px 2px 0 var(--edge); }
.pick canvas { width: 44px; height: 32px; flex: none; }
.pick .pt { flex: 1; min-width: 0; }
.pick .pname { display: block; font-size: 23px; line-height: 1.2; }
.pick .pcon { display: block; font-size: 13px; color: var(--muted); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick .chev { flex: none; display: flex; flex-direction: column; align-items: center; gap: 0; font-size: 11px; color: var(--muted); }
.pick .chev i { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--edge); background: var(--surface); display: grid; place-items: center; }
.pick .chev svg { width: 16px; height: 16px; transition: transform .15s; }
.pick[aria-expanded="true"] .chev svg { transform: rotate(180deg); }
.prow { display: flex; align-items: center; gap: 6px; }
.tagline { flex: 1 1 auto; min-width: 0; display: flex; gap: 6px; overflow: hidden; }
.ptag { flex: none; font-size: 12px; line-height: 1.5; padding: 0 9px; border-radius: 999px; border: 2px solid var(--edge); background: var(--surface); }
.ptag:first-child { background: var(--pc); color: #fff; }
.cta { flex: none; margin-left: auto; min-height: 36px; padding: 3px 13px; font-size: 14px; border-radius: 999px; border: 2.5px solid var(--edge); background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 var(--edge); white-space: nowrap; }
.cta:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
.pick-menu { position: absolute; left: 0; right: 0; top: calc(100% + 10px); z-index: 40; max-height: min(70vh, 560px); overflow: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.pick-menu[hidden] { display: none; }
.pick-menu .grp { font-size: 13px; color: var(--muted); padding: 8px 8px 2px; }
.pick-menu .grp + .opt { margin-top: 2px; }
.opt { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 7px 8px; border-radius: 12px; border: 2px solid transparent; background: none; text-align: left; }
.opt:hover { background: var(--surface-2); }
.opt[aria-selected="true"] { border-color: var(--edge); background: color-mix(in srgb, var(--accent) 30%, var(--surface)); }
.opt canvas { width: 48px; height: 35px; }
.opt svg { width: 48px; height: 32px; }
.opt svg .b { fill: var(--surface); stroke: var(--edge); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.opt svg .a { fill: var(--accent); stroke: var(--edge); stroke-width: 2.4; stroke-linejoin: round; }
.opt svg .l { fill: none; stroke: var(--edge); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.opt b { display: block; font-weight: 400; font-size: 17px; line-height: 1.3; }
.opt small { display: block; font-size: 12px; color: var(--muted); line-height: 1.4; }
.opt .mk { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1.5px solid var(--edge); background: var(--surface); white-space: nowrap; }
.cool { scroll-margin-top: 14px; }
.cool.flash { animation: cmpflash 1.8s ease-out; }

.main { flex: 1; display: flex; flex-direction: column; }
.stage { position: relative; height: clamp(250px, 44vh, 460px); background: var(--stage); touch-action: none; overflow: hidden; border-block: 2.5px solid var(--edge); }
.stage canvas { display: block; width: 100%; height: 100%; }
.ov { position: absolute; display: flex; gap: 6px; align-items: center; pointer-events: none; z-index: 3; }
.ov > * { pointer-events: auto; }
.ov.tl { top: 10px; left: max(12px, env(safe-area-inset-left, 0px)); flex-wrap: wrap; right: 96px; }
.ov.tr { top: 10px; right: max(12px, env(safe-area-inset-right, 0px)); }
.ov.bl { bottom: 10px; left: max(12px, env(safe-area-inset-left, 0px)); flex-wrap: wrap; right: 110px; }
.ov.br { bottom: 10px; right: max(12px, env(safe-area-inset-right, 0px)); }
.pill { background: var(--surface); border: 2px solid var(--edge); border-radius: 999px; padding: 3px 11px; font-size: 14px; font-variant-numeric: tabular-nums; line-height: 1.4; }
.pill.ghost { background: color-mix(in srgb, var(--surface) 70%, transparent); border-style: dashed; color: var(--muted); }
.pill.legend { font-size: 12px; font-family: var(--f-body); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.mini { min-height: 38px; padding: 4px 13px; border-radius: 999px; border: 2px solid var(--edge); background: var(--surface); font-size: 14px; box-shadow: 0 2px 0 var(--edge); }
.mini:active { transform: translateY(2px); box-shadow: none; }
.caption[hidden] { display: none; }
.caption { display: inline-block; max-width: 100%; font-size: 18px; line-height: 1.4; padding: 6px 13px; background: var(--surface); border: 2.5px solid var(--edge); border-radius: 14px 18px 12px 16px; box-shadow: 2px 3px 0 var(--edge); }
.prog { position: absolute; left: 0; right: 0; top: 0; height: 7px; background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--ink) 18%, transparent) 0 8px, transparent 8px 14px); z-index: 2; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); border-right: 2px solid var(--edge); }

/* 3D 部位標籤 */
.parts { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.parts[hidden] { display: none; }
.part-dot { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--surface); border: 2.5px solid var(--edge); }
.part-line { position: absolute; height: 0; border-top: 2px dashed var(--edge); transform-origin: 0 0; }
.part-tag { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; white-space: nowrap; font-size: 14px; line-height: 1.3; padding: 4px 10px; background: var(--accent); color: var(--accent-ink); border: 2px solid var(--edge); border-radius: 12px 9px 12px 9px; box-shadow: 2px 2px 0 var(--edge); }
.part-tag[aria-expanded="true"] { background: var(--surface); color: var(--ink); }
.part-pop { position: absolute; z-index: 4; left: 12px; right: 12px; top: 18px; max-width: 360px; margin: 0 auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.part-pop[hidden] { display: none; }
.part-pop b { font-size: 19px; font-weight: 400; }
.part-pop p { margin: 0; }
.part-pop .kidline { font-size: 17px; }
.part-pop .x { position: absolute; top: 8px; right: 8px; }

.panel { padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.view[hidden] { display: none !important; }
.view { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.eyebrow { font-size: 13px; letter-spacing: 0.06em; color: var(--muted); }
.kid { font-size: 25px; line-height: 1.4; }
.note { font-size: 13px; color: var(--muted); margin: 0; font-family: var(--f-body); }
.src { display: inline-flex; align-items: center; gap: 3px; font-family: var(--f-body); font-size: 12px; line-height: 1; padding: 5px 9px; margin-left: 4px; border-radius: 999px; border: 1.5px solid var(--muted); background: var(--surface); color: var(--muted); vertical-align: 1px; white-space: nowrap; }
.src svg { width: 11px; height: 11px; }

/* 給大人：剪下來的虛線小紙條，可收合 */
details.adult { border: 2px dashed var(--muted); border-radius: 14px; background: color-mix(in srgb, var(--surface) 70%, transparent); }
details.adult > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 6px 12px; font-size: 14px; color: var(--muted); }
details.adult > summary::-webkit-details-marker { display: none; }
details.adult > summary::after { content: "看說明"; margin-left: auto; font-size: 12px; border: 1.5px solid var(--muted); border-radius: 999px; padding: 1px 8px; }
details.adult[open] > summary::after { content: "收起來"; }
details.adult > summary svg { width: 18px; height: 18px; flex: none; }
details.adult .body { padding: 0 14px 12px; font-family: var(--f-body); font-size: 15px; line-height: 1.75; }
details.adult .body p { margin: 0; max-width: 62ch; }

/* 角色卡 */
.hero { --pc: var(--accent); padding: 16px 14px 14px; display: grid; grid-template-columns: minmax(0, 1fr); row-gap: 10px; align-items: center; margin-top: 8px; }
.hero .herot { font-size: 19px; }
.hero .nextcta { grid-column: 1 / -1; }
.hero .face { width: 76px; height: 64px; border-radius: 50% 46% 52% 44%; background: color-mix(in srgb, var(--pc) 24%, var(--surface)); border: 2px solid var(--edge); display: grid; place-items: center; }
.hero .face canvas { width: 64px; height: 46px; }
.hero h2 { font-size: 24px; line-height: 1.2; }
.hero .persona { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.stats4 { grid-column: 1 / -1; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 14px; }
.stats4 li { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 14px; }
.stats4 .pips { display: inline-flex; gap: 3px; }
.stats4 .pips i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--edge); background: var(--surface); }
.stats4 .pips i.on { background: var(--pc); }
.hero .acts { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }

.dots { display: flex; gap: 7px; flex-wrap: wrap; }
.dots button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--edge); background: var(--surface); font-size: 14px; font-variant-numeric: tabular-nums; padding: 0; }
.dots button.past { background: color-mix(in srgb, var(--accent) 45%, var(--surface)); }
.dots button[aria-current="step"] { background: var(--accent); color: var(--accent-ink); box-shadow: 2px 2px 0 var(--edge); transform: scale(1.12); }
.stepbox { padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.stepbox .no { align-self: flex-start; font-size: 14px; padding: 1px 10px; border-radius: 999px; background: var(--ink); color: var(--bg); }
.why { font-size: 21px; line-height: 1.5; margin: 0; }
.why b { font-weight: 400; color: var(--pink); margin-right: 6px; }

.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { min-height: 50px; padding: 8px 18px; border-radius: 16px 13px 16px 13px; border: 2.5px solid var(--edge); background: var(--surface); font-size: 17px; box-shadow: 0 4px 0 var(--edge); transition: transform .06s; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.big { min-height: 62px; font-size: 22px; flex: 1 1 100%; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.grow { flex: 1 1 0; min-width: 0; padding-inline: 8px; }
.btn.big svg { width: 20px; height: 20px; vertical-align: -3px; margin-right: 6px; }
.btn.big.race { background: var(--sky); color: #10283d; }
.row .btn.big { flex: 1 1 0; min-width: 0; font-size: 20px; }

.knob { display: flex; flex-direction: column; gap: 6px; }
.knob .lab { font-size: 16px; display: flex; justify-content: space-between; gap: 8px; }
.knob .lab small { color: var(--muted); font-size: 13px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1 1 0; min-width: 0; min-height: 46px; padding: 4px 2px; border-radius: 12px; border: 2px solid var(--edge); background: var(--surface); font-size: 14px; line-height: 1.25; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.seg button svg { width: 18px; height: 18px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 var(--edge); transform: translateY(-1px); }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; }
.tog { min-height: 40px; padding: 4px 14px; border-radius: 999px; border: 2px solid var(--edge); background: var(--surface); font-size: 15px; }
.tog[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.tiphead { margin: 0; font-size: 19px; }
.result { padding: 16px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.result .stats { display: flex; gap: 16px; font-variant-numeric: tabular-nums; font-size: 15px; color: var(--muted); }
.result .stats b { color: var(--ink); font-size: 28px; font-weight: 400; margin-right: 2px; }
.result p { margin: 0; max-width: 62ch; }
.mission-bar { border-radius: 16px; background: color-mix(in srgb, var(--accent) 16%, var(--surface)); border: 2.5px dashed var(--edge); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.mission-bar .kid { font-size: 20px; }
.win { background: color-mix(in srgb, var(--good) 18%, var(--surface)); border-style: solid; }
.win .eyebrow { color: var(--good); }

.section-title { font-size: 24px; align-self: flex-start; background: linear-gradient(transparent 62%, color-mix(in srgb, var(--accent) 75%, transparent) 62% 92%, transparent 92%); padding: 0 4px; }
.goal { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 10px 16px; background: var(--accent); color: var(--accent-ink); font-size: 21px; }
.goal b { font-weight: 400; white-space: nowrap; }
.goal .mini { color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; flex: none; }

.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rank li { display: grid; grid-template-columns: 28px 6.5em minmax(0, 1fr) 5.2em; align-items: center; gap: 8px; font-size: 15px; padding: 4px 2px; }
.rank li[role="button"] { cursor: pointer; border-radius: 10px; }
.rank .pos { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; background: var(--surface); border: 2px solid var(--edge); font-variant-numeric: tabular-nums; }
.rank li:first-child .pos { background: var(--accent); color: var(--accent-ink); }
.rank .nm { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank .bar { height: 16px; border-radius: 8px; background: var(--surface-2); border: 1.5px solid var(--edge); overflow: hidden; }
.rank .bar i { display: block; height: 100%; background: var(--pc); }
.rank .d { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.board { padding: 16px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
.board h2 { font-size: 20px; }

.tips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.tips li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; padding: 12px; }
.tips li:nth-child(odd) { transform: rotate(-0.5deg); }
.tips li:nth-child(even) { transform: rotate(0.5deg); }
.tips .pos { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); border: 2px solid var(--edge); font-size: 17px; }
.tips b { font-size: 20px; font-weight: 400; }
.tips .kidline { margin: 2px 0 8px; font-size: 17px; }

.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.force { padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.force h3 { font-size: 21px; display: flex; align-items: center; gap: 8px; }
.force h3 svg { width: 24px; height: 24px; flex: none; }
.force .who { font-size: 14px; color: var(--muted); }
.force p { margin: 0; font-size: 15px; }
.idea { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.idea h3 { font-size: 21px; }
.idea .kidline { font-size: 17px; margin: 0; }
.fact { padding: 16px 14px 12px; }
.fact p { margin: 0; }
.fact .num { font-size: 32px; font-variant-numeric: tabular-nums; }

.mission { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px; }
.mission h3 { font-size: 20px; }
.mission p { margin: 2px 0 10px; font-size: 16px; }
.sticker { width: 58px; height: 58px; }
.sticker .s-off { fill: var(--surface-2); stroke: var(--muted); stroke-dasharray: 4 3; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 2.5px solid var(--edge); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .in { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 720px; margin: 0 auto; height: var(--nav-h); }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 14px; color: var(--muted); }
.tabs button svg { width: 34px; height: 30px; padding: 3px 7px; border-radius: 12px; }
.tabs button[aria-selected="true"] { color: var(--ink); }
.tabs button[aria-selected="true"] svg { background: var(--accent); stroke: var(--accent-ink); border: 2px solid var(--edge); padding: 1px 5px; }

.sheet-back { position: fixed; inset: 0; background: rgb(20 18 30 / 0.5); z-index: 30; }
